<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fix YouTube</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; width: 360px; background: #121315; color: #f5f3ef; }
    main { padding: 28px; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 36px; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 650; letter-spacing: -.2px; }
    .mark { display: grid; place-items: center; width: 30px; height: 30px; background: #f3614d; border-radius: 10px; }
    .mark::after { content: ""; border-left: 9px solid #121315; border-top: 5px solid transparent; border-bottom: 5px solid transparent; margin-left: 2px; }
    .status { display: flex; align-items: center; gap: 6px; color: #addbb3; font-size: 11px; }
    .status::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: #addbb3; }
    h1 { font-size: 35px; line-height: 1.08; letter-spacing: -1.5px; font-weight: 650; margin: 0 0 14px; }
    .intro { color: #a9a8a5; font-size: 14px; line-height: 1.6; margin: 0 0 28px; }
    ul { list-style: none; padding: 0; margin: 0 0 28px; border-top: 1px solid #2a2b2d; }
    li { display: flex; align-items: center; justify-content: space-between; font-size: 13px; padding: 14px 0; border-bottom: 1px solid #2a2b2d; }
    li span { color: #aaa8a3; font-size: 12px; }
    a { display: block; text-align: center; background: #f3614d; color: #171311; border-radius: 12px; padding: 14px; font-size: 14px; font-weight: 650; text-decoration: none; }
    a:hover { background: #ff7865; }
    a:focus-visible { outline: 2px solid #f5f3ef; outline-offset: 4px; }
    footer { margin-top: 17px; text-align: center; color: #92928e; font-size: 11px; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand"><span class="mark" aria-hidden="true"></span>Fix YouTube</div>
      <span class="status">Always on</span>
    </header>
    <h1>Watch what<br>you came for.</h1>
    <p class="intro">A quieter YouTube, ready when you are.</p>
    <ul aria-label="Automatic improvements">
      <li>Home<span>Your subscriptions</span></li>
      <li>Shorts &amp; recommendations<span>Hidden</span></li>
      <li>Autoplay<span>Off</span></li>
    </ul>
    <a href="https://www.youtube.com/feed/subscriptions" target="_blank" rel="noopener noreferrer">Open YouTube <span aria-hidden="true">↗</span></a>
    <footer>Works automatically on desktop YouTube.<br>No setup. No watch tracking.</footer>
  </main>
</body>
</html>
