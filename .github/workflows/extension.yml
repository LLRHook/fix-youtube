name: Extension Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test behavior and package contracts
        run: npm test
      - name: Build and validate browser ZIPs
        run: python3 build.py
      - name: Upload extension packages
        uses: actions/upload-artifact@v4
        with:
          name: fix-youtube-packages
          path: |
            fix-youtube-chrome.zip
            fix-youtube-firefox.zip
            fix-youtube-submission-*.zip
          if-no-files-found: error
